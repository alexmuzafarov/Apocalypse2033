<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Website</title>

    <link rel="stylesheet" type="text/css" href="CSS/style.css">
    <link rel="icon" type="image/jpg" href="images/logo.jpg">

    <script type="module" src="scripts/book.js"></script>

<body>

    <header>
        <div class="header-left">
            <img src="images/logo.jpg" width="30" height="30" alt="logo">
            <span class="site-title" id="site-name">Apocalypse 2033</span>

            <!--

        </div>

        <nav class="header-nav">

            <button class="header-button" id="pricing-button">Pricing</button>
            <button class="header-button" id="contact-button">Contact</button>

            <div class="language-switcher">
                <button class="language-button active" id="english-button">🇺🇸 English</button>
                <button class="language-button" id="russian-button">🇷🇺 Russian</button>
            </div>
        </nav>
    </header>


    <!--

            </div>

    <main>

        <section class="reader">

            <div class="reader-header">
                <h1 id="book-title">The Holy Book of The Last Days</h1>
            </div>

            <div class="pdf-reader">

                <div class="pdf-toolbar">

                    <button id="single-page-view">One Page</button>

                    <div class="page-controls">

                        <button id="previous-page" aria-label="Previous page">◀</button>

                        <div class="page-info">
                            <span id="page-label">Page</span>
                            <span id="current-page">1</span>
                            <span>/</span>
                            <span id="total-pages">1</span>
                        </div>

                        <button id="next-page" aria-label="Next page">▶</button>

                    </div>

                    <button id="all-page-view">All Pages</button>

                </div>

                <div class="pdf-container" id="pdf-container"></div>

            </div>

        </section>


        <!--
        <main class="reader-layout">

            <aside class="side-panel"></aside>

            <section class="book-card">
                <select class="chapter-select">Loading...</select>

                <div class="page-content">
                    Loading...
                </div>

                <div class="page-number">
                    1
                </div>
            </section>

            <aside class="side-panel"></aside>

        </main>

        <div class="page-controls">
            <button id="previous-page">◀</button>

            <div id="page-buttons"></div>

            <button id="next-page">▶</button>
        </div>
        -->


        <section class="contact" id="contact-section">
            <h2 id="contact-title">Contact</h2>

            <form>
                <input
                    type="text"
                    name="name"
                    id="contact-name"
                    placeholder="Name"
                    required
                >

                <input
                    type="email"
                    name="email"
                    id="contact-email"
                    placeholder="Email"
                    required
                >

                <textarea
                    name="message"
                    id="contact-message"
                    placeholder="Message"
                    rows="3"
                    required
                ></textarea>

                <button type="submit" id="contact-submit">
                    Send
                </button>
            </form>
        </section>

    </main>


    <footer class="footer">
        <p class="footer__title" id="footer-title">GitHub Pages v1.0</p>
        <p id="copyright">© 2026 All rights reserved</p>
    </footer>

</body>
